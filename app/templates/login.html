<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberSentinel Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            background: #7f1d1d;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .footer {
            text-align: center;
            color: #64748b;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🛡️</div>

    <h1>CyberSentinel</h1>

    <p class="subtitle">
        Security Monitoring Platform
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/login">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div class="footer">
        Authorized Security Testing Platform
    </div>

</div>

</body>
</html>
